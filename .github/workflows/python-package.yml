name: Python package test

on:
  push:
    paths:
      - "pso/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "README.md"
      - "LICENSE"
      - "test/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "pso/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "README.md"
      - "LICENSE"
      - "test/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      # Use only uv-managed interpreters, never the runner's /usr/bin/python3.10.
      # Ubuntu's stdlib ships a regular `test` package; uv-managed builds do not.
      UV_MANAGED_PYTHON: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Keep only locally built wheels; the default uploads the whole uv
          # cache, including several GB of torch/CUDA wheels per leg.
          prune-cache: true
      - name: Sync dependencies
        run: uv sync --locked --group dev --extra examples
      - name: Run tests
        run: uv run --no-sync pytest -q
